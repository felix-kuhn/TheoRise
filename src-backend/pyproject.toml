[project]
name = "theories-backend"
version = "0.1.0"
description = "Backend for the Research Assistant Tauri app: hydrates and stores theories from is.theorizeit.org (PoC)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "httpx2==2.13.1",
  "keyring==25.6.0",
  "openai==3.23.0",
  "numpy==2.5.3",
  "ladybug==0.21.2",
  "lancedb==0.39.0",
  "pyarrow==25.0.1",
  "networkx==3.7",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
